name: Mobile signed release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        type: choice
        options: [both, android, ios]
        default: both
      build_number:
        description: 'Unique increasing build number (e.g. 2)'
        type: string
        required: true
      ios_method:
        description: iOS distribution profile type
        type: choice
        options: [app-store-connect, release-testing]
        default: app-store-connect
permissions:
  contents: read
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false
env:
  BUILD_NUMBER: ${{ inputs.build_number }}
  VITE_CONVERSION_SERVER: ${{ vars.VITE_CONVERSION_SERVER }}
jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    environment: mobile-release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run mobile:sync
      - name: Build and verify signed APK and AAB
        run: python3 scripts/ci/mobile-release.py android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: folio-android-release-${{ inputs.build_number }}
          path: |
            artifacts/folio-android-release.apk
            artifacts/folio-android-release.aab
          if-no-files-found: error
          retention-days: 14
  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-26
    environment: mobile-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Xcode
        run: |
          xcodebuild -version
          python3 -c 'import subprocess; v=subprocess.check_output(["xcodebuild","-version"], text=True).split()[1]; assert int(v.split(".")[0]) >= 26, "Xcode 26+ required"'
      - run: npm ci
      - run: npm test
      - run: npm run mobile:sync
      - name: Archive and export signed IPA
        run: python3 scripts/ci/mobile-release.py ios
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ inputs.ios_method }}
      - uses: actions/upload-artifact@v4
        with:
          name: folio-ios-release-${{ inputs.build_number }}
          path: artifacts/folio-ios.ipa
          if-no-files-found: error
          retention-days: 14
